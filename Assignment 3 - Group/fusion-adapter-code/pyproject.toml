[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vidsam3d"
version = "0.1.0"
description = "V-JEPA 2.1 fusion adapter on a frozen SAM 3D Geometry model"
requires-python = ">=3.10"
# No dependencies here on purpose: the SAM 3D environment provides torch/CUDA,
# and our extras are in requirements.txt, so `pip install -e .` never touches torch.
dependencies = []

[tool.setuptools.packages.find]
include = ["vidsam3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CUDA and SAM 3D; skipped otherwise"]
