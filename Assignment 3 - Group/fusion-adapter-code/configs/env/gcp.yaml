# Google Cloud (Vertex AI custom job or GPU VM with gcsfuse). Buckets are mounted at /gcs/<bucket>.
# Code and the pinned repos live in the image (/opt/vidsam3d); checkpoints/logs go to local
# disk first, then get copied to the bucket.
paths:
  data_root: ${oc.env:DATA_ROOT,/gcs/${oc.env:GCS_BUCKET,vidsam3d}/dataset}
  output_root: ${oc.env:OUTPUT_ROOT,/gcs/${oc.env:GCS_BUCKET,vidsam3d}/outputs}
  scratch_root: ${oc.env:SCRATCH_ROOT,/tmp/vidsam3d_scratch}
  cache_root: ${oc.env:CACHE_ROOT,/gcs/${oc.env:GCS_BUCKET,vidsam3d}/cache}
  sam3d_repo: ${oc.env:SAM3D_REPO,/opt/vidsam3d/sam-3d-objects}
  sam3d_checkpoint_dir: ${oc.env:SAM3D_CHECKPOINT_DIR,/gcs/${oc.env:GCS_BUCKET,vidsam3d}/checkpoints/sam3d}
  hf_home: ${oc.env:HF_HOME,/gcs/${oc.env:GCS_BUCKET,vidsam3d}/hf_home}
  vjepa2_repo: ${oc.env:VJEPA2_REPO,/opt/vidsam3d/vjepa2}
