[project]
name = "atdl-video-reconstruction"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chz>=0.4",
    "pydantic>=2",
    "numpy>=1.26,<3",
    "pillow>=10",
    "scipy>=1.11",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "optree>=0.14",
    "astor>=0.8",
    "loguru>=0.7",
    "huggingface-hub>=0.30",
    "fire>=0.7.1",
]

[project.optional-dependencies]
gpu = ["torch==2.9.1", "torchvision==0.24.1", "timm>=1", "einops>=0.8", "wandb>=0.19", "trimesh>=4.5", "scikit-image>=0.24", "imageio[ffmpeg]>=2.36", "mediapy>=1.2", "iopath>=0.1.10", "safetensors>=0.4"]

[dependency-groups]
analysis = [
    "ipykernel>=6",
    "matplotlib>=3.8",
    "modal>=1.4",
    "nbclient>=0.10",
    "nbformat>=5",
    "plotly>=6",
    "trimesh>=4.5",
    "wandb>=0.19",
]
dev = [
    "imageio[ffmpeg]>=2.38.1",
    "optree>=0.20.0",
    "pytest>=8",
    "scikit-image>=0.26.0",
    "timm>=1.0.30",
    "trimesh>=5.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video3d"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
