[project]
name = "sam3dvid"
version = "0.1.0"
description = "Synthetic video dataset generator for SAM 3D -> video"
requires-python = ">=3.11,<3.12"
dependencies = [
    "blenderproc==2.8.0",
    "numpy>=1.26,<2.1",
    "scipy>=1.13",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "pyyaml>=6.0",
    "trimesh>=4.4",
    "open3d>=0.18",
    "imageio[ffmpeg]>=2.35",
    "requests>=2.32",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sam3dvid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders clips with Blender", "sampled: runs on a SAM3DVID_SAMPLE_FRAC sample of clips"]
